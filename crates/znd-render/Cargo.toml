[package]
name = "znd-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
znd-core.workspace = true
znd-text.workspace = true
rayon.workspace = true
thiserror.workspace = true
libloading = "0.8"
# プラグイン（WebAssembly）をサンドボックスで動かす。WASI は入れない（ファイル・ネットワーク・プロセスに触れさせない）
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "anyhow"] }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
gltf = "1"
ufbx = "0.11"
image.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
znd-text.workspace = true
wat = "1"
