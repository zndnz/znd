# egui のアプリ（znd-app）と Tauri のアプリ（znd-studio）の両方が使う。

[dependencies]
znd-core.workspace = true
znd-render.workspace = true
znd-media.workspace = true
znd-gpu.workspace = true
znd-audio.workspace = true
znd-script.workspace = true
rayon.workspace = true
serde_json.workspace = true
cpal = "0.15"
