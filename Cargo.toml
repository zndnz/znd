[workspace]
resolver = "2"
members = ["crates/znd-core", "crates/znd-text", "crates/znd-render", "crates/znd-audio", "crates/znd-script", "crates/znd-media", "crates/znd-gpu", "crates/znd-cli", "crates/znd-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "tiff", "tga", "bmp", "webp"] }
znd-core = { path = "crates/znd-core" }
znd-render = { path = "crates/znd-render" }
znd-text = { path = "crates/znd-text" }
znd-audio = { path = "crates/znd-audio" }
znd-script = { path = "crates/znd-script" }
znd-media = { path = "crates/znd-media" }
znd-gpu = { path = "crates/znd-gpu" }

# デバッグ情報とインクリメンタルビルドは成果物が数 GB になるので切っている
[profile.dev]
opt-level = 2
debug = false
incremental = false

[profile.release]
opt-level = 3
debug = false
